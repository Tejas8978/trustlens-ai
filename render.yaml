services:
  - type: web
    name: trustlens-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 8
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONMALLOC
        value: malloc
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MONGO_URI
        sync: false   # Set this manually in the Render dashboard
      - key: MONGO_DB_NAME
        value: trustlens
