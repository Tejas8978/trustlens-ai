services:
  - type: web
    name: trustlens-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MONGO_URI
        sync: false   # Set this manually in the Render dashboard
      - key: MONGO_DB_NAME
        value: trustlens
